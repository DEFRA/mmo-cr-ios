name: iOS CI

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - main
  workflow_dispatch:      

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & analyse
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      # Xcode is pre-selected by default on this runner image, so explicit xcode-select isn't needed — revisit if that changes.
      # - name: Select Xcode
      #   run: |
      #     set -euo pipefail
      #     XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
      #     if [ -z "$XCODE_APP" ]; then
      #       echo "::error::No Xcode 26.x found under /Applications" >&2
      #       ls /Applications | grep -i xcode >&2 || true
      #       exit 1
      #     fi
      #     echo "Selecting $XCODE_APP"
      #     sudo xcode-select -s "$XCODE_APP/Contents/Developer"
      #     xcodebuild -version

      - name: Verify iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -version

          # The default Xcode's iOS Simulator runtime isn't always pre-cached on the runner image, so fetch it on demand.
          if ! xcrun simctl list devices available 2>/dev/null | grep -qE "iPhone 17 \("; then
            echo "iPhone 17 simulator not found — downloading the iOS Simulator platform..."
            xcodebuild -downloadPlatform iOS || true
            if ! xcrun simctl list devices available 2>/dev/null | grep -qE "iPhone 17 \("; then
              echo "::error::iPhone 17 Simulator still unavailable after downloading the iOS platform" >&2
              xcrun simctl list devices available >&2 || true
              exit 1
            fi
          fi

      - name: Cache Swift Package Manager
        uses: actions/cache@v4.3.0
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # - name: SwiftLint
      #   run: |
      #     if ! command -v swiftlint >/dev/null 2>&1; then
      #       brew install swiftlint
      #     fi
      #     swiftlint lint --reporter github-actions-logging

      - name: Build
        run: |
          set -euo pipefail
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi
          xcodebuild clean build \
            -project record-catch.xcodeproj \
            -scheme record-catch \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            | xcbeautify

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          xcodebuild test \
            -project record-catch.xcodeproj \
            -scheme record-catch \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -skip-testing:record-catchUITests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify

      - name: Convert coverage to SonarQube generic format
        run: bash scripts/xccov-to-sonarqube-generic.sh TestResults.xcresult > sonar-coverage.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-coverage
          path: sonar-coverage.xml
          retention-days: 14

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.MMO_CR_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            ${{ github.event_name != 'pull_request' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
