name: iOS CI

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - main
  workflow_dispatch:
    inputs:
      publish_release_tag:
        description: "Publish release tag v<marketing>-BUILD_<build> once CI passes (does not start a release)"
        type: boolean
        default: false
  merge_group:

permissions:
  contents: read

# Never cancel a main run: every non-Dependabot merge to main must publish its own release tag.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: Build, test & analyse
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      # Dependabot PRs carry no bump; they ship with the next release (and their merges are not tagged).
      - name: Verify version has been bumped
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: bash .github/workflows/scripts/check-version-bump.sh

      # Xcode is pre-selected by default on this runner image, so explicit xcode-select isn't needed — revisit if that changes.
      # - name: Select Xcode
      #   run: |
      #     set -euo pipefail
      #     XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
      #     if [ -z "$XCODE_APP" ]; then
      #       echo "::error::No Xcode 26.x found under /Applications" >&2
      #       ls /Applications | grep -i xcode >&2 || true
      #       exit 1
      #     fi
      #     echo "Selecting $XCODE_APP"
      #     sudo xcode-select -s "$XCODE_APP/Contents/Developer"
      #     xcodebuild -version

      - name: Verify iOS Simulator
        run: bash .github/workflows/scripts/verify-simulator.sh

      - name: Cache Swift Package Manager
        uses: actions/cache@v4.3.0
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint --reporter github-actions-logging

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build (Fastlane)
        run: bundle exec fastlane build

      - name: Run unit tests with coverage (Fastlane)
        run: bundle exec fastlane test

      - name: Convert coverage to SonarQube generic format
        run: bash .github/workflows/scripts/convert-coverage.sh

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-coverage
          path: sonar-coverage.xml
          retention-days: 14

          #COMMENTED FOR TESTING
      # - name: SonarQube Cloud scan
      #   uses: SonarSource/sonarqube-scan-action@v8.2.1
      #   env:
      #     SONAR_TOKEN: ${{ secrets.MMO_CR_SONAR_TOKEN }}
      #     SONAR_HOST_URL: https://sonarcloud.io
      #   with:
      #     args: ${{ github.event_name != 'pull_request' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}

  # Tags only — CI never starts a release; iOS Release is run manually on the tag.
  release-tag:
    name: Publish release tag
    needs: build-test
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release_tag) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Detect Dependabot merge
        id: source
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/detect-dependabot-merge.sh

      - name: Create and push release tag
        if: ${{ steps.source.outputs.dependabot != 'true' }}
        run: bash .github/workflows/scripts/create-release-tag.sh
