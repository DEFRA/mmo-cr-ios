name: iOS CI

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - main
  workflow_dispatch:      

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & analyse
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      # Xcode is pre-selected by default on this runner image, so explicit xcode-select isn't needed — revisit if that changes.
      # - name: Select Xcode
      #   run: |
      #     set -euo pipefail
      #     XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
      #     if [ -z "$XCODE_APP" ]; then
      #       echo "::error::No Xcode 26.x found under /Applications" >&2
      #       ls /Applications | grep -i xcode >&2 || true
      #       exit 1
      #     fi
      #     echo "Selecting $XCODE_APP"
      #     sudo xcode-select -s "$XCODE_APP/Contents/Developer"
      #     xcodebuild -version

      - name: Verify iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -version

          # The default Xcode's iOS Simulator runtime isn't always pre-cached on the runner image, so fetch it on demand.
          if ! xcrun simctl list devices available 2>/dev/null | grep -qE "iPhone 17 \("; then
            echo "iPhone 17 simulator not found — downloading the iOS Simulator platform..."
            xcodebuild -downloadPlatform iOS || true
            if ! xcrun simctl list devices available 2>/dev/null | grep -qE "iPhone 17 \("; then
              echo "::error::iPhone 17 Simulator still unavailable after downloading the iOS platform" >&2
              xcrun simctl list devices available >&2 || true
              exit 1
            fi
          fi

      - name: Cache Swift Package Manager
        uses: actions/cache@v4.3.0
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # - name: SwiftLint
      #   run: |
      #     if ! command -v swiftlint >/dev/null 2>&1; then
      #       brew install swiftlint
      #     fi
      #     swiftlint lint --reporter github-actions-logging

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build (Fastlane)
        run: bundle exec fastlane build

      - name: Run unit tests with coverage (Fastlane)
        run: bundle exec fastlane test

      - name: Convert coverage to SonarQube generic format
        run: |
          set -euo pipefail
          XCRESULT="$(find fastlane/test_output -maxdepth 2 -name '*.xcresult' | head -n1)"
          if [ -z "$XCRESULT" ]; then
            echo "::error::No .xcresult bundle found under fastlane/test_output" >&2
            exit 1
          fi
          bash scripts/xccov-to-sonarqube-generic.sh "$XCRESULT" > sonar-coverage.xml

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-coverage
          path: sonar-coverage.xml
          retention-days: 14

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.MMO_CR_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            ${{ github.event_name != 'pull_request' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
