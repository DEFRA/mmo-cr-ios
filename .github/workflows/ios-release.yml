name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version override (CFBundleShortVersionString, e.g. 2.0.0) — optional"
        required: false
      project_version:
        description: "Build number override (CFBundleVersion / CURRENT_PROJECT_VERSION, e.g. 8) — optional"
        required: false

permissions:
  contents: read

# Release runs must never be auto-cancelled.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-build-internal:
    name: Dev → build, sign & internal TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate tag matches project MARKETING_VERSION
        env:
          INPUT_MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
          INPUT_PROJECT_VERSION: ${{ github.event.inputs.project_version }}
        run: bash .github/workflows/scripts/validate-release-tag.sh

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Build, sign & upload DEV to internal TestFlight
        env:
          # Optional version overrides for manual workflow_dispatch runs.
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ github.event.inputs.project_version }}
          # App Store Connect API key — used for the TestFlight upload.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Fastlane Match — read-only sync from DEFRA/mmo-cr-ios-signing-assets (see docs/adr/0011-release-pipeline.md).
          # MATCH_GIT_PRIVATE_KEY is exported by the deploy-key step above.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane release_dev

      - name: Submit to External Testers on TestFlight
        env:
          # App Store Connect API key — used to assign build to external group.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Comma-separated external TestFlight group names.
          ASC_EXTERNAL_TESTING_GROUPS: ${{ secrets.ASC_EXTERNAL_TESTING_GROUPS }}
        run: bundle exec fastlane distribute_dev_external

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh
