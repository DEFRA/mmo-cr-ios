name: iOS Release

on:
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.4.0) — used when running without a tag"
        required: false
        default: ""

permissions:
  contents: read

# Release runs must never be auto-cancelled.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

# Tag-triggered release pipeline. Scope: DEV environment only (see docs/adr/0011-release-pipeline.md).
# The test/prod build, external-promotion and App Store jobs from the design (Sections 11-12) are
# deferred until their bundle IDs, .xcconfig/schemes, App Store Connect apps, signing assets and
# GitHub Environments/secrets are provisioned.
jobs:
  dev-build-internal:
    name: Dev → build, sign & internal TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    # Ungated environment; scopes the Dev signing and App Store Connect credentials to this job only.
    environment: dev
    permissions:
      contents: read
    env:
      # App Store Connect API key (dev environment secrets) — used for the TestFlight upload.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      # Manual .p12 signing config (POC — Fastlane Match bypassed; see docs/adr/0011-release-pipeline.md).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
      # POC bypasses Fastlane Match — the manual .p12 + profile are installed by the step below.
      # MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      # MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Apple signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dev_signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/dev.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the certificate and provisioning profile from secrets.
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Create and unlock a temporary keychain, then import the signing certificate.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install the provisioning profile where Xcode looks for it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Derive marketing version
        id: ident
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == ios-v* ]]; then
            MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}"
          else
            MARKETING_VERSION="${{ github.event.inputs.marketing_version }}"
          fi
          if [[ -z "${MARKETING_VERSION}" ]]; then
            echo "::error::No marketing version — push an ios-vX.Y.Z tag or supply the workflow_dispatch input" >&2
            exit 1
          fi
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build, sign & upload DEV to internal TestFlight
        env:
          MARKETING_VERSION: ${{ steps.ident.outputs.marketing_version }}
        run: bundle exec fastlane release_dev

      - name: Clean up temporary keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" || true
