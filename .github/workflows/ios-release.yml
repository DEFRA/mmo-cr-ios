name: iOS Release
run-name: iOS Release ${{ github.ref_name }} (dev ${{ inputs.dev }}, test ${{ inputs.test }}, prod ${{ inputs.prod }})

on:
  # Single entry point: Actions → iOS Release → Run workflow, with "Use workflow from" set to a v* release tag.
  workflow_dispatch:
    inputs:
      dev:
        description: "Dev: internal + external TestFlight (Dev backend)"
        type: boolean
        default: true
      test:
        description: "Test: internal (Test) then external TestFlight (Perf-Test)"
        type: boolean
        default: true
      prod:
        description: "Prod: internal (UAT), external (Prod candidate), then App Store"
        type: boolean
        default: true

permissions:
  contents: read

# Release runs must never be auto-cancelled.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and stages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Validate the release tag matches the code
        run: bash .github/workflows/scripts/validate-release-tag.sh

      - name: List the apps to compile
        id: apps
        env:
          DEV: ${{ inputs.dev }}
          TEST: ${{ inputs.test }}
          PROD: ${{ inputs.prod }}
        run: |
          apps=$(jq -cn --argjson dev "$DEV" --argjson test "$TEST" --argjson prod "$PROD" \
            '{dev: $dev, test: $test, prod: $prod} | to_entries | map(select(.value) | .key)')
          if [[ "$apps" == "[]" ]]; then
            echo "::error::Select at least one of dev, test or prod." >&2
            exit 1
          fi
          echo "Compiling: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  # Compiles each selected app once from the tagged commit; every later stage only packages, signs and uploads.
  compile:
    name: Compile ${{ matrix.app }}
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: release-build
    strategy:
      matrix:
        app: ${{ fromJSON(needs.validate.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Compile and sign the archive
        env:
          APP: ${{ matrix.app }}
          # MATCH_GIT_PRIVATE_KEY is exported by the deploy-key step above.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane compile "app:$APP"

      - name: Encrypt the compiled archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh encrypt

      - name: Keep the encrypted archive for the release stages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archive-${{ matrix.app }}
          path: build/release-archive.tar.gz.enc
          if-no-files-found: error
          # Matches the 90-day TestFlight build lifetime.
          retention-days: 90

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  dev:
    name: Dev → internal and external TestFlight
    needs: compile
    if: ${{ inputs.dev }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the compiled archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-dev
          path: build

      - name: Decrypt the compiled archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Package build N & upload to internal and external TestFlight
        env:
          # Fastlane keeps only the CR_APP_CFG_* keys allow-listed in Config/app-config.schema.json
          CR_APP_CFG_VARS: ${{ toJSON(vars) }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Comma-separated external TestFlight group names.
          ASC_EXTERNAL_TESTING_GROUPS: ${{ secrets.ASC_EXTERNAL_TESTING_GROUPS }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane upload_internal app:dev

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  # A skipped earlier stage never blocks a later one; a failed or rejected stage stops everything after it.
  test-internal:
    name: Test → internal TestFlight (Test)
    needs: [compile, dev]
    if: ${{ !cancelled() && inputs.test && needs.compile.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the compiled archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-test
          path: build

      - name: Decrypt the compiled archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Package build N & upload to internal TestFlight
        env:
          CR_APP_CFG_VARS: ${{ toJSON(vars) }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane upload_internal app:test

      # The external stage's leak check needs the internal config this package now carries.
      - name: Encrypt the internal archive for promotion
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh encrypt

      - name: Keep the encrypted archive for promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archive-test-internal
          path: build/release-archive.tar.gz.enc
          if-no-files-found: error
          retention-days: 90

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  test-external:
    name: Test → external TestFlight (Perf-Test)
    needs: test-internal
    if: ${{ !cancelled() && needs.test-internal.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: test-external
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the internal archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-test-internal
          path: build

      - name: Decrypt the internal archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Re-package as N.1 with the external config & upload to external TestFlight
        env:
          CR_APP_CFG_VARS: ${{ toJSON(vars) }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_EXTERNAL_TESTING_GROUPS: ${{ secrets.ASC_EXTERNAL_TESTING_GROUPS }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane promote_external app:test

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  prod-internal:
    name: Prod → internal TestFlight (UAT)
    needs: [compile, dev, test-internal, test-external]
    if: ${{ !cancelled() && inputs.prod && needs.compile.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the compiled archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-prod
          path: build

      - name: Decrypt the compiled archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Package build N & upload to internal TestFlight
        env:
          CR_APP_CFG_VARS: ${{ toJSON(vars) }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane upload_internal app:prod

      - name: Encrypt the internal archive for promotion
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh encrypt

      - name: Keep the encrypted archive for promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archive-prod-internal
          path: build/release-archive.tar.gz.enc
          if-no-files-found: error
          retention-days: 90

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  prod-external:
    name: Prod → external TestFlight (Prod candidate)
    needs: prod-internal
    if: ${{ !cancelled() && needs.prod-internal.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45
    environment: prod-external
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the internal archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-prod-internal
          path: build

      - name: Decrypt the internal archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Re-package as N.1 with the external config & upload to external TestFlight
        env:
          CR_APP_CFG_VARS: ${{ toJSON(vars) }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_EXTERNAL_TESTING_GROUPS: ${{ secrets.ASC_EXTERNAL_TESTING_GROUPS }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane promote_external app:prod

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  # App Store Connect API calls only: no packaging or signing, so no macOS runner.
  prod-appstore:
    name: Prod → App Store submission
    needs: prod-external
    if: ${{ !cancelled() && needs.prod-external.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod-appstore
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Submit the same N.1 upload for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane submit_app_store app:prod
