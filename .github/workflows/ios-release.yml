name: iOS Release

on:
  # Single entry point: Actions → iOS Release → Run workflow, with "Use workflow from" set to a v* release tag.
  workflow_dispatch:

permissions:
  contents: read

# Release runs must never be auto-cancelled.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-build:
    name: Dev → internal TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate the release tag matches the code
        run: bash .github/workflows/scripts/validate-release-tag.sh

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Compile sign & upload build to internal TestFlight
        env:
          # The one backend URL for this stage — a `dev` Environment variable, never committed (ADR-0014).
          MMO_API_BASE_URL: ${{ vars.MMO_API_BASE_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # MATCH_GIT_PRIVATE_KEY is exported by the deploy-key step above.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane build_internal app:dev

      - name: Encrypt the compiled archive for promotion
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh encrypt

      - name: Keep the encrypted archive for promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archive-dev
          path: build/release-archive.tar.gz.enc
          if-no-files-found: error
          # Matches the 90-day TestFlight build lifetime.
          retention-days: 90

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh

  # Demo of the ADR-0015 promotion path on the Dev app. Test/Prod promotions will run from ios-promote.yml.
  dev-promote-external:
    name: Dev → external TestFlight
    needs: dev-build
    runs-on: macos-26
    timeout-minutes: 45
    environment: dev_external
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the encrypted archive from the build job
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archive-dev
          path: build

      - name: Decrypt the compiled archive
        env:
          ARCHIVE_ENCRYPTION_KEY: ${{ secrets.ARCHIVE_ENCRYPTION_KEY }}
        run: bash .github/workflows/scripts/release-archive.sh decrypt

      - name: Set up Fastlane Match SSH deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: bash .github/workflows/scripts/setup-match-ssh-key.sh

      - name: Re-package with the external backend & upload to external TestFlight
        env:
          # The external backend URL — a `dev_external` Environment variable.
          MMO_API_BASE_URL: ${{ vars.MMO_API_BASE_URL }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Comma-separated external TestFlight group names.
          ASC_EXTERNAL_TESTING_GROUPS: ${{ secrets.ASC_EXTERNAL_TESTING_GROUPS }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane promote_external app:dev

      - name: Clean up signing key and temporary keychain
        if: ${{ always() }}
        run: bash .github/workflows/scripts/cleanup-signing-assets.sh
