name: iOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version override (CFBundleShortVersionString, e.g. 2.0.0) — optional"
        required: false
      project_version:
        description: "Build number override (CFBundleVersion / CURRENT_PROJECT_VERSION, e.g. 8) — optional"
        required: false

permissions:
  contents: read

# Release runs must never be auto-cancelled.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

# Tag-triggered release pipeline. Scope: DEV environment only (see docs/adr/0011-release-pipeline.md).
# The test/prod build, external-promotion and App Store jobs from the design (Sections 11-12) are
# deferred until their bundle IDs, .xcconfig/schemes, App Store Connect apps, signing assets and
# GitHub Environments/secrets are provisioned.
jobs:
  dev-build-internal:
    name: Dev → build, sign & internal TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    # Ungated environment; scopes the Dev signing and App Store Connect credentials to this job only.
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Apple signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dev_signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/dev.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the certificate and provisioning profile from secrets.
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Create and unlock a temporary keychain, then import the signing certificate.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Install the provisioning profile where Xcode looks for it.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Validate tag matches project MARKETING_VERSION
        run: |
          set -euo pipefail
          # Read the app target's MARKETING_VERSION — it precedes the app's
          # PRODUCT_BUNDLE_IDENTIFIER in each of its build configs.
          PROJECT_VERSION=$(awk '
            /MARKETING_VERSION = / { line=$0; sub(/^.*MARKETING_VERSION = /, "", line); sub(/;.*$/, "", line); last=line }
            /PRODUCT_BUNDLE_IDENTIFIER = mmo\.catchrecordingdev\.ios;/ { print last; exit }
          ' record-catch.xcodeproj/project.pbxproj)
          if [[ -z "${PROJECT_VERSION}" ]]; then
            echo "::error::Could not read the app target's MARKETING_VERSION from project.pbxproj" >&2
            exit 1
          fi

          # On tag pushes, validate tag matches project MARKETING_VERSION.
          # On workflow_dispatch, log any manual overrides or confirm fallback to project.pbxproj.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${EXPECTED_VERSION}" != "${PROJECT_VERSION}" ]]; then
              echo "::error::Tag version ${EXPECTED_VERSION} does not match project MARKETING_VERSION ${PROJECT_VERSION} — align the tag with the app version in project.pbxproj" >&2
              exit 1
            fi
            echo "Tag version ${EXPECTED_VERSION} matches project MARKETING_VERSION ${PROJECT_VERSION}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ github.event.inputs.marketing_version }}" ]]; then
              echo "Using manual marketing_version override: ${{ github.event.inputs.marketing_version }}"
            else
              echo "Using project MARKETING_VERSION: ${PROJECT_VERSION}"
            fi
            if [[ -n "${{ github.event.inputs.project_version }}" ]]; then
              echo "Using manual project_version override: ${{ github.event.inputs.project_version }}"
            else
              echo "Using project CURRENT_PROJECT_VERSION from project.pbxproj"
            fi
          else
            echo "::error::Unsupported trigger '${GITHUB_EVENT_NAME}' for ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}' — push a v* tag or use workflow_dispatch" >&2
            exit 1
          fi

      - name: Build, sign & upload DEV to internal TestFlight
        env:
          # Optional version overrides for manual workflow_dispatch runs.
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ github.event.inputs.project_version }}
          # App Store Connect API key — used for the TestFlight upload.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          # Manual .p12 signing config (POC — Fastlane Match bypassed; see docs/adr/0011-release-pipeline.md).
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane release_dev

      - name: Clean up temporary keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" || true
