# SwiftLint configuration — MMO Catch Recording iOS
# Starting posture is deliberately conservative so the lint gate is useful without
# blocking on a large backlog of pre-existing style nits. Ratchet rules up over time
# (see docs/adr/0007-ci-pipeline.md).

included:
  - record-catch
  - record-catchTests
  - record-catchUITests

excluded:
  - DerivedData
  - .build
  - fastlane
  - scripts

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - empty_string
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unused_import

disabled_rules:
  - todo # tracked in the issue tracker, not the linter

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

type_name:
  max_length:
    warning: 50
    error: 60

reporter: "xcode"
