# SonarQube Cloud (SonarCloud) analysis configuration.
#
# TODO(setup): before this analysis can run, a maintainer must, in the DEFRA
# SonarCloud organisation (https://sonarcloud.io/organizations/defra):
#   1. Create the project and confirm the organization + project keys below.
#   2. Turn OFF "Automatic Analysis" for the project (required for CI-based analysis).
#   3. Add a SONAR_TOKEN as a GitHub Actions secret (repo or environment scope).
# Until SONAR_TOKEN is present the scan step in ios-ci.yml is skipped, so PRs stay green.

sonar.organization=defra
sonar.projectKey=DEFRA_mmo-cr-ios
sonar.projectName=MMO Catch Recording iOS

# Sources and tests
sonar.sources=record-catch
sonar.tests=record-catchTests,record-catchUITests
sonar.sourceEncoding=UTF-8

# Swift coverage: the CI job converts the Xcode .xcresult into the Sonar generic
# coverage format (sonar-coverage.xml) via scripts/xccov-to-sonarqube-generic.sh.
sonar.coverageReportPaths=sonar-coverage.xml

# Fail the CI job if the quality gate does not pass.
sonar.qualitygate.wait=true
