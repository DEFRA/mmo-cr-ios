sonar.organization=defra
sonar.projectKey=DEFRA_mmo-cr-ios
sonar.projectName=mmo-cr-ios

# Sources and tests
sonar.sources=record-catch
sonar.tests=record-catchTests,record-catchUITests
sonar.sourceEncoding=UTF-8

# Swift coverage
sonar.coverageReportPaths=sonar-coverage.xml

# Fail the CI job if the quality gate does not pass.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage exclusions.
#
# The first six entries are narrowly scoped per ADR-0016 §4, NOT a blanket "**/*View.swift" or
# Components exclusion (that was explicitly considered and rejected). Each is genuinely
# logic-free: a pure layout/presentation wrapper with no branching, no state and no behaviour of
# its own (SettingsLinkRow, LinkButton, ViewFooter, TitleText), a placeholder screen with static
# copy only (NotificationsPlaceholderView), or test-only scaffolding never exercised by product
# code (UITestRootView, used solely as the UI-test launch root — see `record_catchApp`).
#
# TripDatePicker.swift (added alongside ADR-0017) is excluded on the same narrow ground: it only
# forwards a `Binding<Date>` and a pre-computed `range` into a native SwiftUI `DatePicker`, with
# no validation/error-state logic of its own — that responsibility moved into `TripDateViewModel`,
# which is fully unit-tested. `record-catchUITests` exercises the picker's accessibility
# identifier end-to-end, but per ADR-0008 §3 / fastlane's `test` lane, UI tests are not yet wired
# into the coverage-generating CI lane, so this pure-forwarding view would otherwise register as
# 0% covered "new code" despite carrying no testable behaviour of its own.
#
# FLAGGED DEVIATION FROM ADR-0016 §4 — everything below this point is excluded at explicit
# developer instruction, NOT because it is logic-free. ADR-0016 §4 explicitly rejected a blanket
# "**/*View.swift" exclusion on the grounds that most views carry real conditional logic,
# validation, routing or accessibility behaviour that must stay counted — that rejected pattern
# is effectively what this list has become (~4,960 of the app's ~7,550 uncovered lines, across
# every screen in the CatchRecord journey, Settings/ManageAccount, AppLock, Home, RootTabView and
# the map view layer). This masks the DEFRA-mandated view-layer coverage gap rather than closing
# it and should be raised with Delivery Architecture (delivery.architecture@defra.gov.uk) as a
# standing exception, ideally with a target date to remove it once the preview-driven
# snapshot-testing programme (ADR-0016 §5) or the existing `record-catchUITests` journeys
# (already seeding several of these screens via `UITestRootView`'s `-uiTest*` launch arguments,
# but not yet wired into the `fastlane test` CI lane — see ADR-0008 §3) provide real coverage.
# `SignInView` (70% covered), `SubrectangleAnnotationView` and `PortLabelAnnotationView` (93-94%
# covered) are deliberately left OUT of this list — they already carry meaningful real coverage
# that excluding them would only hide, not earn.
sonar.coverage.exclusions=\
  record-catch/Features/Common/Components/Settings/SettingsLinkRow.swift,\
  record-catch/Features/Common/Components/Form/LinkButton.swift,\
  record-catch/Features/Common/Components/Form/TripDatePicker.swift,\
