sonar.organization=defra
sonar.projectKey=DEFRA_mmo-cr-ios
sonar.projectName=mmo-cr-ios

# Sources and tests
sonar.sources=record-catch
sonar.tests=record-catchTests,record-catchUITests
sonar.sourceEncoding=UTF-8

# Swift coverage
sonar.coverageReportPaths=sonar-coverage.xml

# Fail the CI job if the quality gate does not pass.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Coverage exclusions — narrowly scoped, NOT a blanket "**/*View.swift" or Components exclusion
# (that was explicitly considered and rejected). Each of these six files is genuinely
# logic-free: a pure layout/presentation wrapper with no branching, no state and no behaviour of
# its own (SettingsLinkRow, LinkButton, ViewFooter, TitleText), a placeholder screen with static
# copy only (NotificationsPlaceholderView), or test-only scaffolding never exercised by product
# code (UITestRootView, used solely as the UI-test launch root — see `record_catchApp`). Every
# other view in the app — including every view with real conditional logic, state or
# accessibility behaviour — remains fully in scope for coverage. The much larger view-layer
# coverage backlog (SwiftUI bodies are not rendered by unit tests) is addressed separately by a
# preview-driven snapshot-testing programme, not by further exclusions here (see
# docs/adr/0016-coverage-strategy-and-scoped-exclusions.md).
sonar.coverage.exclusions=\
  record-catch/Features/Common/Components/Settings/SettingsLinkRow.swift,\
  record-catch/Features/Common/Components/Form/LinkButton.swift,\
  record-catch/Features/Notifications/Views/NotificationsPlaceholderView.swift,\
  record-catch/Features/Common/Views/ViewFooter.swift,\
  record-catch/Features/Common/Components/Typography/TitleText.swift,\
  record-catch/App/UITestRootView.swift
