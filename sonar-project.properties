sonar.organization=defra
sonar.projectKey=DEFRA_mmo-cr-ios
sonar.projectName=mmo-cr-ios

# Sources and tests
sonar.sources=record-catch
sonar.tests=record-catchTests,record-catchUITests
sonar.sourceEncoding=UTF-8

# Swift coverage
sonar.coverageReportPaths=sonar-coverage.xml

# Fail the CI job if the quality gate does not pass.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300